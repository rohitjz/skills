name: validate
on: [push, pull_request]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate.py
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install matplotlib pillow openpyxl playwright
      - run: python -m playwright install --with-deps chromium
      - name: Tooling checks
        run: python tests/test_tools.py
      - name: Render-test every sample
        run: python tests/run_samples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sample-screenshots, path: tests/out, retention-days: 7 }
